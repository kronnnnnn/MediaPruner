name: Actionlint (workflow lint)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - develop
      - main
      - fix/ci-workflows

permissions:
  contents: read

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/latest/download/actionlint_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Run actionlint
        run: |
          actionlint .github/workflows || (echo "actionlint found issues" && exit 1)
