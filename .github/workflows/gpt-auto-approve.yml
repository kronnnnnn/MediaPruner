name: GPT Auto-Approve PRs on CI success

on:
  workflow_run:
    workflows:
      - "Copilot Review (label) on CI success"
    types:
      - completed
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Optional: PR number to run auto-approve against (useful for manual runs)'
        required: false
        default: ''

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  debug_event:
    name: Debug event payload
    runs-on: ubuntu-latest
    steps:
      - name: Dump event payload (debug)
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            echo "Event payload contents:";
            cat "$GITHUB_EVENT_PATH" || true
          else
            echo "No event payload file at $GITHUB_EVENT_PATH"
          fi

  approve:
    # Run when Copilot Review workflow_run completed (success or skipped),
    # or when the copilot label is added to a PR, or when manually dispatched
    if: (github.event.workflow_run && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'skipped')) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label && github.event.label.name == 'copilot-approved') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dump event payload
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH" || true

      - name: Resolve associated PRs
        id: resolve_prs
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload || {};
            let prs = [];
            if (payload.workflow_run && payload.workflow_run.pull_requests && payload.workflow_run.pull_requests.length) {
              prs = payload.workflow_run.pull_requests.map(p => p.number);
            } else if (payload.workflow_run && payload.workflow_run.head_sha) {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const sha = payload.workflow_run.head_sha;
              try {
                const resp = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
                  owner, repo, commit_sha: sha, headers: { accept: 'application/vnd.github.groot-preview+json' }
                });
                prs = resp.data.map(p => p.number);
              } catch (e) {
                console.log('Commit->PRs lookup failed:', e.message || e);
              }
            } else if (payload.pull_request) {
              prs = [payload.pull_request.number];
            }
            console.log('Resolved PRs:', prs);
            return prs.join(',');

      - name: Abort if no PRs found
        run: |
          if [ -z "${{ steps.resolve_prs.outputs.result }}" ]; then
            echo "No associated PRs found for this workflow_run; skipping approval.";
            exit 0;
          fi

      - name: Process PRs and create approval checks
        uses: actions/github-script@v7
        with:
          script: |
            const prsRaw = "${{ steps.resolve_prs.outputs.result }}";
            const prs = prsRaw ? prsRaw.split(',').map(p => parseInt(p,10)).filter(Boolean) : [];
            
            for (const prNumber of prs) {
              console.log('Processing PR', prNumber);
              
              // Get PR details to get head SHA
              const prResp = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber });
              const headSha = prResp.data.head.sha;
              const labels = prResp.data.labels.map(l => l.name);
              
              // Check if PR has copilot-approved label
              if (!labels.includes('copilot-approved')) {
                console.log(`PR #${prNumber} does not have copilot-approved label; skipping`);
                continue;
              }
              
              console.log(`PR #${prNumber} has copilot-approved label; creating check`);
              
              // Create approval check run
              try {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'mediapruner/auto-approve',
                  head_sha: headSha,
                  status: 'completed',
                  conclusion: 'success',
                  output: {
                    title: 'Auto-approve check',
                    summary: 'Automated approval condition met: CI passed and Copilot label detected.'
                  }
                });
                console.log(`Created approval check for PR #${prNumber}`);
              } catch (error) {
                console.error(`Failed to create check for PR #${prNumber}:`, error.message);
              }
            }