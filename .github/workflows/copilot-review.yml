---
name: Copilot Review (label) on CI success

'on':
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pull_number:
        description: >-
          Optional: PR number to run Copilot review
          against (useful for manual runs)
        required: false
        default: ''

permissions:
  issues: write
  pull-requests: write
  contents: read
  checks: write

jobs:
  copilot_review:
    # Run when CI workflow_run completed successfully, or when manually dispatched
    # We'll resolve PRs inside the job to handle both pull_request and push events
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run != null &&
          github.event.workflow_run.conclusion == 'success') ||
          github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve associated PRs
        id: resolve_prs
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload || {};
            let prs = [];
            
            if (payload.workflow_run && payload.workflow_run.pull_requests && payload.workflow_run.pull_requests.length) {
              prs = payload.workflow_run.pull_requests.map(p => ({ number: p.number, head_sha: p.head.sha }));
              console.log('Found PRs from workflow_run.pull_requests:', prs);
            } else if (payload.workflow_run && payload.workflow_run.head_sha) {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const sha = payload.workflow_run.head_sha;
              console.log('Looking up PRs for commit SHA:', sha);
              try {
                const resp = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
                  owner, repo, commit_sha: sha, headers: { accept: 'application/vnd.github.groot-preview+json' }
                });
                prs = resp.data.map(p => ({ number: p.number, head_sha: p.head.sha }));
                console.log('Found PRs from commit lookup:', prs);
              } catch (e) {
                console.log('Commit->PRs lookup failed:', e.message || e);
              }
            } else if (payload.inputs && payload.inputs.pull_number) {
              prs = [{ number: parseInt(payload.inputs.pull_number, 10) }];
              console.log('Using manual PR number:', prs);
            }
            
            if (!prs.length) {
              console.log('No associated PRs found; will skip review.');
              return JSON.stringify([]);
            }
            
            return JSON.stringify(prs);

      - name: Check if PRs found
        id: check_prs
        run: |
          PRS='${{ steps.resolve_prs.outputs.result }}'
          if [ "$PRS" = "[]" ] || [ -z "$PRS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No PRs found - will exit successfully without running tests"
            exit 0
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "PRs found - will proceed with review"
          fi

      - name: Checkout PR head
        if: steps.check_prs.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.resolve_prs.outputs.result)[0].head_sha || github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        if: steps.check_prs.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.check_prs.outputs.skip != 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        if: steps.check_prs.outputs.skip != 'true'
        working-directory: ./frontend
        run: npm run build

      - name: Lint frontend
        if: steps.check_prs.outputs.skip != 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Setup Python
        if: steps.check_prs.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        if: steps.check_prs.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # ensure test runner is available
          pip install pytest pytest-asyncio

      - name: Test Python imports
        if: steps.check_prs.outputs.skip != 'true'
        run: |
          cd backend
          PYTHONPATH=. python -c "from app.main import app; print('OK')"


      - name: Run backend tests
        if: steps.check_prs.outputs.skip != 'true'
        working-directory: ./backend
        run: |
          PYTHONPATH=. pytest -q

      - name: Add Copilot approval label if CI and additional checks passed
        if: steps.check_prs.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prsRaw = '${{ steps.resolve_prs.outputs.result }}';
            const prs = JSON.parse(prsRaw || '[]');

            if (!prs.length) {
                console.log('No associated pull requests found.');
                return;
            }

            for (const pr of prs) {
              const prNumber = pr.number;

              // Fetch PR details to inspect draft status and metadata
              const prDetailsResp = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const prDetails = prDetailsResp.data;

              // Skip drafts
              if (prDetails.draft) {
                console.log(`PR #${prNumber} is a draft; skipping label.`);
                continue;
              }

              // If label already exists, skip
              const labelsResp = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              const labels = labelsResp.data.map(l => l.name);

              if (labels.includes('copilot-approved')) {
                console.log(`PR #${prNumber} already labeled copilot-approved.`);
                continue;
              }

              // Add label and post a comment
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['copilot-approved'],
              });

              const commentBody = 'Automated review: CI passed; added label.';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });

              console.log(`Labeled PR #${prNumber} as copilot-approved`);
            }

      - name: Create mediapruner/auto-approve check
        if: steps.check_prs.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prsRaw = '${{ steps.resolve_prs.outputs.result }}';
            const prs = JSON.parse(prsRaw || '[]');

            if (!prs.length) {
              console.log('No associated pull requests found; skipping check creation.');
              return;
            }

            for (const pr of prs) {
              const prNumber = pr.number;
              const headSha = pr.head_sha;

              console.log(`Creating mediapruner/auto-approve check for PR #${prNumber} at SHA ${headSha}`);

              try {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'mediapruner/auto-approve',
                  head_sha: headSha,
                  status: 'completed',
                  conclusion: 'success',
                  output: {
                    title: 'Auto-approve check',
                    summary: 'Automated approval: CI passed and Copilot Review completed successfully.'
                  }
                });
                console.log(`Successfully created check for PR #${prNumber}`);
              } catch (error) {
                console.error(`Failed to create check for PR #${prNumber}:`, error.message);
              }
            }
