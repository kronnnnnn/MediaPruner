name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  secret-scan:
    name: Secret scanning (gitleaks + detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Note: removed gitleaks GitHub Action due to recent breaking changes in the action inputs and token requirements.
      # We retain the python-based detect-secrets check below which runs the project's baseline script.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Run detect-secrets check against baseline
        run: |
          python scripts/check_new_secrets.py || (echo "New detect-secrets findings detected; see detect-secrets-report.json" && exit 1)

      - name: Upload detect-secrets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-report
          path: detect-secrets-report.json

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run linting
        run: |
          pip install ruff
          ruff check backend/
      
      - name: Test imports
        run: |
          cd backend
          python -c "from app.main import app; print('Backend imports OK')"

      - name: Run backend tests
        run: |
          cd backend
          PYTHONPATH=. pytest tests -q

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test
      
      - name: Type check
        run: |
          cd frontend
          npm run build
      
      - name: Lint
        run: |
          cd frontend
          npm run lint || true

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mediapruner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create the mediapruner/auto-approve check when all CI jobs pass
  auto-approve-check:
    name: Create auto-approve check
    runs-on: ubuntu-latest
    needs: [secret-scan, test-backend, test-frontend, build-docker]
    if: github.event_name == 'pull_request'
    steps:
      - name: Create mediapruner/auto-approve check
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            
            console.log(`Creating mediapruner/auto-approve check for PR #${prNumber} at SHA ${headSha}`);
            
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'mediapruner/auto-approve',
                head_sha: headSha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Auto-approve check',
                  summary: 'All CI checks passed. PR is approved for merge.'
                }
              });
              console.log('Successfully created auto-approve check');
            } catch (error) {
              console.error('Failed to create check:', error.message);
              throw error;
            }
